DATA:
  data_root: './datasets/FSSD-12'
  train_list: './data_list/FSSD-12/train/fold1_defect.txt'
  val_list: './data_list/FSSD-12/val/fold1_defect.txt'
  classes: 2
  model_name: FH-Net

TRAIN:
  layers: 50
  sync_bn: False
  train_h: 200
  train_w: 200
  val_size: 200
  scale_min: 0.9    # minimum random scale
  scale_max: 1.1    # maximum random scale
  rotate_min: -10   # minimum random rotate
  rotate_max: 10    # maximum random rotate
  zoom_factor: 8
  ignore_label: 255
  padding_label: 255
  aux_weight: 1.0
  train_gpu: [0]
  workers: 4        # data loader workers 2->4
  batch_size: 2     # batch size for training
  batch_size_val: 1
  base_lr: 0.0001
  epochs: 200
  start_epoch: 0
  power: 0.9        # 0 means no decay
  momentum: 0.9
  weight_decay: 0.0001
  manual_seed: 1998
  print_freq: 5
  save_freq: 5
  save_path: './exp/FSSD-12/fold1_resnet50_5shot'  # model saved path
  shot: 5
  weight:   # load weight for fine-tuning or testing
  resume:                                         # path to latest checkpoint (default: none)
  evaluate: True
  split: 1


  ppm_scales: [60, 30, 15, 8]
  fix_random_seed_val: True
  warmup: False
  resized_val: True
  ori_resize: True  # use original label for evaluation


